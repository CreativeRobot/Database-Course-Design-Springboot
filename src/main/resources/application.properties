spring.application.name=demo

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookstore?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:BookStoreSystemSecretKeyForJwtTokenAuthentication2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
app.order.expiration-scan-ms=${APP_ORDER_EXPIRATION_SCAN_MS:60000}
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.upload.public-url-prefix=${APP_UPLOAD_PUBLIC_URL_PREFIX:/uploads}
app.upload.max-image-size=${APP_UPLOAD_MAX_IMAGE_SIZE:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
