spring.application.name=demo

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/database_1?serverTimezone=Asia/Shanghai&useSSL=false&characterEncoding=utf-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:BookStoreSystemSecretKeyForJwtTokenAuthentication2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}