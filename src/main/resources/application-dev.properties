spring.config.activate.on-profile=dev

# 仅供本机开发使用；生产环境必须通过外部环境变量注入。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookstore?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# IntelliJ 直接运行时可使用本地开发密钥；生产环境仍由 application.properties 强制要求 JWT_SECRET。
jwt.secret=${JWT_SECRET:bookstore-dev-secret-key-2026-abcdef}
spring.jpa.show-sql=true

